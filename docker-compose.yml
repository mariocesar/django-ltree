services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taxonomy_db
    tmpfs:
      # Ephemeral data dir: fresh start on every run. Avoids issues when switching between postgres versions.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    image: ghcr.io/astral-sh/uv:python${PYTHON_VERSION:-3.13}-trixie-slim
    working_dir: /app
    command: uv run pytest tests/
    environment:
      DJANGO_DATABASE_HOST: postgres
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - venv:/opt/venv
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  uv-cache:
  venv:
